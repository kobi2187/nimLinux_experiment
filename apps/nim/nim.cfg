# NimixOS userspace app config — applies to all apps under apps/nim/
#
# Key differences from kernel nim.cfg:
#   - --os:standalone  (uses bump allocator via StandaloneHeapSize)
#   - PIE (-fPIC -pie)  so the SASOS loader can place us anywhere
#   - no -mcmodel:kernel  (that's ring-0 only)
#   - no custom linker script  (loader handles placement)

--os:standalone
--mm:arc
--cpu:amd64
--noMain

-d:StandaloneHeapSize=1048576
-d:noSignalHandler
-d:nimNoLentIterators

--passC:"-ffreestanding"
--passC:"-fno-stack-protector"
--passC:"-mno-red-zone"
--passC:"-fPIC"
--passL:"-nostdlib"
--passL:"-pie"
--passL:"-static-pie"

# Kernel ABI header search path
--passC:"-I../../kernel/abi"
