# NimixOS Compiler Configuration

# Freestanding environment
--os:any
--mm:arc
--panics:on   # a failed check halts loudly (rtl_stubs → serial), never unwinds silently
-d:StandaloneHeapSize=16777216
--passC:"-fdata-sections"   # theHeap in its own section; kernel.ld page-aligns it

# Disable runtime features that require OS
-d:noSignalHandler
-d:nimNoLentIterators

# No standard library initialization
--noMain

# Strict compilation
--warning[UnusedImport]:on
--hint[ConvFromXtoItselfNotNeeded]:on

# Code generation
--passC:"-ffreestanding"
--passC:"-fno-stack-protector"
--passC:"-mno-red-zone"
--passC:"-fno-omit-frame-pointer"   # serial crash backtraces walk the rbp chain
--passC:"-Werror=frame-larger-than=8192"   # boot stack is 16 KB, right above the boot page tables
--passL:"-nostdlib"
--passL:"-static"

# Architecture-specific (x86_64 default)
--cpu:amd64
--passC:"-mcmodel=kernel"
--passC:"-fno-pic"

# Custom linker script for kernel layout
--passL:"-T arch/x86_64/kernel.ld -Wl,--build-id=none"

# Arsenal library path
--path:"vendor/arsenal/src"
